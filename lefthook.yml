# Lefthook configuration
# https://github.com/evilmartians/lefthook
#
# LOCAL convenience only — bypassable with `git commit --no-verify`.
# CI (.github/workflows/ci.yml) is the AUTHORITATIVE, non-bypassable gate; the
# same commands re-run there to actually block a merge. Never rely on
# Lefthook to enforce anything — it is fast local feedback, nothing more.

pre-commit:
  parallel: true
  jobs:
    # Ultracite/Biome format + lint. `bun run check` runs across the repo;
    # depth (extends-only config, the TanStack route-filename caveat) is owned
    # by the biome-ultracite layer.
    - name: check
      run: bun run check
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"

    # Committed code must be BMAD-agnostic: no planning-artifact ids (AD/FR/NFR/
    # AC/Story/risk) in tracked source or tests. Scans the tracked code tree;
    # only runs when code files are staged. CI re-runs it as the blocking gate.
    - name: bmad-refs
      run: bun run gate:bmad-refs
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,surql}"

pre-push:
  parallel: false
  jobs:
    # Verify the COMMITTED HEAD before it leaves the machine: refuse on a dirty
    # tree, then run type check + the full Vitest suite + the structural gates
    # (meta-gate, tier-boundary, reference guard). This is the one command that
    # reproduces "the full suite on the committed HEAD" so it can't be a
    # forgotten habit. Bypassable with `git push --no-verify` (CI is the
    # non-bypassable backstop); ALLOW_DIRTY=1 runs it against the working copy.
    - name: verify-head
      run: bun run verify:head
